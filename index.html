<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植物 完全記憶トレーナー</title>
<style>
:root{
  --ink:#14261c; --muted:#5f7a68; --line:#d6e6da; --bg:#f1f8f3; --card:#fff;
  --accent:#1f6b42; --accent2:#35a06a; --ok:#1a7f5a; --okbg:#e6f6ef;
  --ng:#b3261e; --ngbg:#fdecea; --amber:#a86b00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#164a2e,#35a06a);color:#fff;padding:16px}
header h1{margin:0;font-size:19px;letter-spacing:.02em}
header p{margin:6px 0 0;font-size:12.5px;opacity:.9;line-height:1.6}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;max-width:900px;margin:0 auto}
.tabs button{white-space:nowrap;font:inherit;font-size:13px;padding:9px 15px;border-radius:10px 10px 0 0;cursor:pointer;
 border:1px solid var(--line);border-bottom:none;background:#e3f0e7;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--accent);font-weight:800}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;
 box-shadow:0 1px 3px rgba(20,60,40,.05)}
.panel h2{margin:0 0 9px;font-size:12.5px;color:var(--muted);letter-spacing:.08em;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.row:last-child{margin-bottom:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);
 padding:8px 12px;font-size:13.5px;transition:.12s}
button:hover{border-color:var(--accent2)}
button:disabled{cursor:default;opacity:.45}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800;padding:11px 22px;font-size:15px}
.primary:hover{background:#175735}
.ghost{background:#e8f3ec}
.bar{height:7px;background:#e0ede4;border-radius:99px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#35a06a,#164a2e);width:0;transition:.3s}
.stats{font-size:12.5px;color:var(--muted);line-height:1.6}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:center;
 box-shadow:0 2px 8px rgba(20,60,40,.06)}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;color:#fff;background:var(--accent2);
 border-radius:99px;padding:3px 11px;margin:0 3px 10px}
.tag.s{background:#7ea391}
.qtext{font-size:19px;font-weight:800;line-height:1.6;margin:0;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
@media(max-width:560px){.choices{grid-template-columns:1fr}.qtext{font-size:17px}}
.choices button{padding:13px 12px;font-size:14.5px;text-align:left;line-height:1.4}
.pickok{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important;font-weight:800}
.pickng{background:var(--ngbg)!important;border-color:var(--ng)!important;color:var(--ng)!important;font-weight:800}
.feed{margin-top:15px;border-radius:11px;padding:13px;text-align:left;display:none}
.feed.ok{background:var(--okbg);border:1px solid #b8e3d0}
.feed.ng{background:var(--ngbg);border:1px solid #f2c4bf}
.verdict{font-weight:800;font-size:15.5px;margin-bottom:6px}
.feed.ok .verdict{color:var(--ok)} .feed.ng .verdict{color:var(--ng)}
.ansline{font-size:17px;font-weight:800;margin-bottom:7px;line-height:1.5}
.detail{background:#fff;border:1px dashed #bcd8c6;border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.7}
.detail b{color:var(--accent)}
.nav{display:flex;gap:8px;justify-content:center;margin-top:15px;flex-wrap:wrap}
.score{font-size:50px;font-weight:800;color:var(--accent);line-height:1.1}
.scoresub{color:var(--muted);font-size:14px;margin-top:4px}
.missrow{border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:8px;padding:9px 11px;margin-bottom:6px;
 font-size:13px;background:#fff;line-height:1.6}
.missrow b{color:var(--accent)}
.missrow span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
/* diagram */
.figwrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;margin:0 auto 4px;max-width:420px}
.figwrap svg{width:100%;height:auto;display:block}
.pin circle{fill:#fff;stroke:#14261c;stroke-width:2}
.pin text{font-size:13px;font-weight:800;fill:#14261c;text-anchor:middle;dominant-baseline:central;
 font-family:"Hiragino Kaku Gothic ProN",sans-serif}
.pin.hot circle{fill:#e03a2f;stroke:#7d1a13}
.pin.hot text{fill:#fff}
.pin.done circle{fill:#cfe6d8}
/* sort mode */
.sortitem{font-size:22px;font-weight:800;margin:6px 0 14px}
.buckets{display:grid;gap:8px}
.bucket{border:2px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;text-align:left}
.bucket .bn{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:5px}
.bucket .bi{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.bucket .bi span{font-size:12px;border-radius:99px;padding:2px 9px;background:#eef6f1;border:1px solid var(--line)}
.bucket .bi span.bad{background:var(--ngbg);border-color:#f2c4bf;color:var(--ng);text-decoration:line-through}
.bucket .bi span.good{background:var(--okbg);border-color:#b8e3d0;color:var(--ok)}
.bbtns{display:grid;gap:7px;margin-top:12px}
.bbtns button{text-align:left;padding:12px;font-size:14.5px;font-weight:700}
/* cards */
.flash{background:#fff;border:2px solid var(--line);border-radius:14px;padding:30px 18px;text-align:center;
 min-height:190px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,60,40,.06)}
.flash .f{font-size:24px;font-weight:800;line-height:1.5}
.flash .b{font-size:15.5px;line-height:1.8;margin-top:14px;color:var(--accent);border-top:1px dashed var(--line);padding-top:14px}
.flash .hint{font-size:12px;color:var(--muted);margin-top:12px}
/* list */
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;margin-bottom:6px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#e2f0e7;color:var(--accent);font-size:12.5px}
td.g{width:34%;font-weight:800;color:var(--accent)}
.listtitle{margin:16px 0 6px;font-size:15px;font-weight:800;color:var(--accent)}
.listnote{font-size:12px;color:var(--muted);margin:0 0 6px}
.hidden-cell{color:transparent;background:#eef4f0;cursor:pointer;border-radius:4px}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:18px 10px 34px;line-height:1.7}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>植物 完全記憶トレーナー</h1>
  <p>グノーブル 植物1〜4（つくりとはたらき／花と受粉／植物の分類／生態系）対応。まず名前と分類を頭に入れるための6つの練習モードです。</p>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap">

  <!-- ============ テスト ============ -->
  <div id="m-test">
    <div id="t-setup">
      <div class="panel">
        <h2>1. 出題形式（複数選べます）</h2>
        <div class="row" id="kindRow"></div>
        <div class="row"><button class="ghost" id="allKind">すべて選択</button><button class="ghost" id="noKind">すべて解除</button></div>
      </div>
      <div class="panel">
        <h2>2. 分野（複数選べます）</h2>
        <div class="row" id="secRow"></div>
        <div class="row"><button class="ghost" id="allSec">すべて選択</button><button class="ghost" id="noSec">すべて解除</button></div>
      </div>
      <div class="panel">
        <h2>3. 問題数</h2>
        <div class="row" id="cntRow">
          <button class="chip on" data-cnt="10">10問</button>
          <button class="chip" data-cnt="20">20問</button>
          <button class="chip" data-cnt="30">30問</button>
          <button class="chip" data-cnt="50">50問</button>
          <button class="chip" data-cnt="0">全問</button>
        </div>
        <div class="stats" id="poolInfo"></div>
      </div>
      <div class="row" style="justify-content:center"><button class="primary" id="startBtn">テスト開始</button></div>
    </div>

    <div id="t-quiz" class="hide">
      <div class="qmeta"><span id="prog"></span><span id="live"></span></div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="qbox" style="margin-top:11px">
        <div><span class="tag" id="tagK"></span><span class="tag s" id="tagS"></span></div>
        <div id="figHost"></div>
        <p class="qtext" id="qtext"></p>
        <div id="ansarea"></div>
        <div class="feed" id="feed">
          <div class="verdict" id="verdict"></div>
          <div class="ansline" id="ansline"></div>
          <div class="detail" id="detail"></div>
        </div>
        <div class="nav" id="nav"></div>
      </div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" id="quitBtn">やめて設定に戻る</button></div>
    </div>

    <div id="t-result" class="hide">
      <div class="panel" style="text-align:center">
        <div class="score" id="scoreNum"></div>
        <div class="scoresub" id="scoreSub"></div>
        <div class="bar"><i id="rbar"></i></div>
        <div class="row" style="justify-content:center;margin-top:14px">
          <button class="primary" id="retryMiss">まちがえた問題だけ再挑戦</button>
          <button class="ghost" id="againBtn">もう一度同じ設定で</button>
          <button class="ghost" id="backBtn">設定に戻る</button>
        </div>
      </div>
      <div class="panel" id="missPanel"><h2>まちがえた問題</h2><div id="missBody"></div></div>
    </div>
  </div>

  <!-- ============ 仕分け ============ -->
  <div id="m-sort" class="hide">
    <div id="s-setup">
      <div class="panel">
        <h2>仕分けセットを選ぶ</h2>
        <p class="stats" style="margin:0 0 10px">出てきた名前を、正しいグループのボタンへ振り分けます。分類の暗記にいちばん効きます。</p>
        <div class="row" id="sortList"></div>
      </div>
    </div>
    <div id="s-play" class="hide">
      <div class="qmeta"><span id="sprog"></span><span id="slive"></span></div>
      <div class="bar"><i id="sbar"></i></div>
      <div class="qbox" style="margin-top:11px">
        <div><span class="tag" id="stag"></span></div>
        <div class="sortitem" id="sitem"></div>
        <div class="bbtns" id="sbtns"></div>
        <div class="feed" id="sfeed"><div class="verdict" id="sverdict"></div><div class="detail" id="sdetail"></div></div>
      </div>
      <div class="panel" style="margin-top:12px"><div class="buckets" id="sbuckets"></div></div>
      <div class="row" style="justify-content:center"><button class="ghost" id="sQuit">仕分け一覧にもどる</button></div>
    </div>
  </div>

  <!-- ============ カード ============ -->
  <div id="m-card" class="hide">
    <div class="panel">
      <h2>分野（複数選べます）</h2>
      <div class="row" id="cSecRow"></div>
      <div class="row">
        <button class="ghost" id="cAll">すべて選択</button>
        <button class="ghost" id="cNone">すべて解除</button>
        <button class="primary" id="cStart">カード開始</button>
      </div>
      <div class="stats" id="cInfo"></div>
    </div>
    <div id="c-play" class="hide">
      <div class="qmeta"><span id="cprog"></span><span id="cdone"></span></div>
      <div class="bar"><i id="cbar"></i></div>
      <div class="flash" id="flash" style="margin-top:11px">
        <div class="f" id="cfront"></div>
        <div class="b hide" id="cback"></div>
        <div class="hint" id="chint">タップすると答えが出ます</div>
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="ghost" id="cAgainBtn">まだ覚えていない</button>
        <button class="primary" id="cOkBtn">覚えた</button>
      </div>
      <div class="row" style="justify-content:center"><button class="ghost" id="cQuit">やめる</button></div>
    </div>
  </div>

  <!-- ============ 一覧 ============ -->
  <div id="m-list" class="hide">
    <div class="panel">
      <div class="row" id="lSecRow"></div>
      <div class="row">
        <button class="chip on" id="lShow">全部表示</button>
        <button class="chip" id="lHide">なかまを隠す</button>
      </div>
      <p class="stats" style="margin:0">隠したマスをタップすると、そこだけ答えが出ます。</p>
    </div>
    <div id="lBody"></div>
  </div>

</div>
<footer>植物 完全記憶トレーナー｜グノーブル 6年理科 植物1〜4 にもとづく自習教材</footer>

function pin(n,x,y){ return '<g class="pin" data-n="'+n+'"><circle cx="'+x+'" cy="'+y+'" r="13"/><text x="'+x+'" y="'+y+'">'+n+'</text></g>'; }
function lead(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+G+'" stroke-width="1.4" stroke-dasharray="4 3"/>'; }
function lbl(x,y,t,anchor){ return '<text x="'+x+'" y="'+y+'" font-size="12" font-weight="700" fill="'+G+'" text-anchor="'+(anchor||'middle')+'" font-family="sans-serif">'+t+'</text>'; }

function ringStem(cx,cy,r,br){
  var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fbf7e8" stroke="'+G+'" stroke-width="3.2"/>';
  for(var i=0;i<8;i++){
    var a=-Math.PI/2+i*Math.PI/4, x=cx+Math.cos(a)*br, y=cy+Math.sin(a)*br;
    s+='<g transform="translate('+x+','+y+') rotate('+(a*180/Math.PI+90)+')">'+
       '<ellipse cx="0" cy="0" rx="14" ry="20" fill="#fff" stroke="'+G+'" stroke-width="2.2"/>'+
       '<ellipse cx="0" cy="-8" rx="8.5" ry="6" fill="#d6e2f7" stroke="'+G+'" stroke-width="1.3"/>'+
       '<ellipse cx="0" cy="8" rx="8.5" ry="6" fill="#f7d6d0" stroke="'+G+'" stroke-width="1.3"/>'+
       '<path d="M-14 0 h28" stroke="'+G+'" stroke-width="1.6"/></g>';
  }
  return s;
}
function scatterStem(cx,cy,r){
  var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fbf7e8" stroke="'+G+'" stroke-width="3.2"/>';
  var pts=[[-46,-56],[24,-64],[68,-24],[-62,-6],[-6,-14],[46,20],[-44,44],[18,60],[74,-70],[-72,30],[-14,84],[54,68],[86,26],[-84,-38]];
  for(var i=0;i<pts.length;i++){
    var x=cx+pts[i][0], y=cy+pts[i][1];
    s+='<ellipse cx="'+x+'" cy="'+y+'" rx="14" ry="10.5" fill="#fff" stroke="'+G+'" stroke-width="2.2"/>'+
       '<circle cx="'+(x-4.5)+'" cy="'+y+'" r="4.6" fill="#d6e2f7" stroke="'+G+'" stroke-width="1.1"/>'+
       '<circle cx="'+(x+4.5)+'" cy="'+y+'" r="4.6" fill="#f7d6d0" stroke="'+G+'" stroke-width="1.1"/>';
  }
  return s;
}

DIAGS.forEach(function(d,di){
  d.pins.forEach(function(p){
    DQ.push({s:d.s,k:"diag",q:"図の「"+circled(p.n)+"」は何？",a:p.a,c:[p.a].concat(p.c),n:d.note,d:di,pn:p.n});
  });
});
function renderDiag(di,hot){
  var d=DIAGS[di];
  var svg='<div class="figwrap"><svg viewBox="'+d.vb+'" xmlns="http://www.w3.org/2000/svg">'+d.f()+'</svg></div>';
  var host=document.createElement('div'); host.innerHTML=svg;
  var pins=host.querySelectorAll('.pin');
  for(var i=0;i<pins.length;i++){
    if(parseInt(pins[i].getAttribute('data-n'),10)===hot) pins[i].setAttribute('class','pin hot');
  }
  return host.innerHTML;
}

/* ================= 共通 ================= */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mkChips(host, list, state, cb){
  host.innerHTML='';
  list.forEach(function(x){
    var b=document.createElement('button'); b.className='chip'+(state[x]?' on':''); b.textContent=x;
    b.onclick=function(){ state[x]=!state[x]; b.className='chip'+(state[x]?' on':''); cb&&cb(); };
    host.appendChild(b);
  });
}

/* ================= タブ ================= */
var MODES=[["test","テスト"],["sort","仕分け"],["card","カード"],["list","一覧"]];
var curMode="test";
MODES.forEach(function(m){
  var b=document.createElement('button'); b.textContent=m[1]; b.setAttribute('data-m',m[0]);
  b.onclick=function(){ setMode(m[0]); };
  $('tabs').appendChild(b);
});
function setMode(m){
  curMode=m;
  var bs=$('tabs').querySelectorAll('button');
  for(var i=0;i<bs.length;i++) bs[i].className=(bs[i].getAttribute('data-m')===m)?'on':'';
  ['test','sort','card','list'].forEach(function(k){ $('m-'+k).className=(k===m)?'':'hide'; });
  if(m==='list') buildList();
  window.scrollTo(0,0);
}

/* ================= テストモード ================= */
var ALLQ = DB.q.filter(function(x){return x.k!=='sort' && x.k!=='card';}).concat(DQ);
var KINDS=[["qa","一問一答"],["which","分類あて"],["odd","なかまはずれ"],["diag","図で覚える"]];
var KNAME={}; KINDS.forEach(function(k){KNAME[k[0]]=k[1];});
var selK={}, selS={}, count=10, queue=[], idx=0, correct=0, misses=[], answered=false;
KINDS.forEach(function(k){selK[k[0]]=true;});
SECS.forEach(function(s){selS[s]=true;});
mkChips($('kindRow'), KINDS.map(function(k){return k[1];}), {}, null);
$('kindRow').innerHTML='';
KINDS.forEach(function(k){
  var b=document.createElement('button'); b.className='chip on'; b.textContent=k[1];
  b.onclick=function(){ selK[k[0]]=!selK[k[0]]; b.className='chip'+(selK[k[0]]?' on':''); updatePool(); };
  b.setAttribute('data-k',k[0]); $('kindRow').appendChild(b);
});
mkChips($('secRow'), SECS, selS, updatePool);
$('allKind').onclick=function(){KINDS.forEach(function(k){selK[k[0]]=true;});syncK();};
$('noKind').onclick=function(){KINDS.forEach(function(k){selK[k[0]]=false;});syncK();};
$('allSec').onclick=function(){SECS.forEach(function(s){selS[s]=true;});mkChips($('secRow'),SECS,selS,updatePool);updatePool();};
$('noSec').onclick=function(){SECS.forEach(function(s){selS[s]=false;});mkChips($('secRow'),SECS,selS,updatePool);updatePool();};
function syncK(){
  var bs=$('kindRow').querySelectorAll('button[data-k]');
  for(var i=0;i<bs.length;i++){var k=bs[i].getAttribute('data-k');bs[i].className='chip'+(selK[k]?' on':'');}
  updatePool();
}
$('cntRow').addEventListener('click',function(ev){
  var t=ev.target; if(t.tagName!=='BUTTON'||!t.hasAttribute('data-cnt'))return;
  var bs=$('cntRow').querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].className='chip';
  t.className='chip on'; count=parseInt(t.getAttribute('data-cnt'),10); updatePool();
});
function pool(){ return ALLQ.filter(function(x){ return selK[x.k] && selS[x.s]; }); }
function updatePool(){
  var n=pool().length;
  $('poolInfo').textContent='選択中の範囲：'+n+'問／出題：'+(count?Math.min(count,n):n)+'問';
  $('startBtn').disabled=(n===0);
}
updatePool();
$('startBtn').onclick=function(){ build(pool()); tshow('quiz'); render(); };
$('againBtn').onclick=function(){ build(pool()); tshow('quiz'); render(); };
$('backBtn').onclick=function(){ tshow('setup'); };
$('quitBtn').onclick=function(){ tshow('setup'); };
$('retryMiss').onclick=function(){ var it=misses.map(function(m){return m.q;}); if(!it.length){tshow('setup');return;} build(it,true); tshow('quiz'); render(); };
function build(src,all){ var a=shuffle(src.slice()); queue=(all||count===0)?a:a.slice(0,Math.min(count,a.length)); idx=0;correct=0;misses=[]; }
function tshow(w){ ['setup','quiz','result'].forEach(function(k){ $('t-'+k).className=(k===w)?'':'hide'; }); window.scrollTo(0,0); }

function render(){
  answered=false;
  if(idx>=queue.length){ finish(); return; }
  var it=queue[idx];
  $('prog').textContent='第'+(idx+1)+'問 / 全'+queue.length+'問';
  $('live').textContent='正解 '+correct+'　誤答 '+misses.length;
  $('barfill').style.width=(idx/queue.length*100)+'%';
  $('feed').style.display='none'; $('nav').innerHTML=''; $('ansarea').innerHTML='';
  $('tagK').textContent=KNAME[it.k]||it.k; $('tagS').textContent=it.s;
  $('figHost').innerHTML = (it.k==='diag') ? ('<div style="font-size:12.5px;color:#5f7a68;margin-bottom:6px">'+esc(DIAGS[it.d].t)+'</div>'+renderDiag(it.d,it.pn)) : '';
  $('qtext').textContent=it.q;
  var box=document.createElement('div'); box.className='choices';
  shuffle(it.c.slice()).forEach(function(o){
    var b=document.createElement('button'); b.textContent=o;
    b.onclick=function(){ if(answered)return; judge(o===it.a,it,b,o); };
    box.appendChild(b);
  });
  $('ansarea').appendChild(box);
}
function judge(ok,it,btn,given){
  answered=true;
  if(ok) correct++; else misses.push({q:it,given:given});
  btn.className=ok?'pickok':'pickng';
  var bs=btn.parentNode.querySelectorAll('button');
  for(var i=0;i<bs.length;i++) if(bs[i].textContent===it.a) bs[i].className='pickok';
  var f=$('feed'); f.className='feed '+(ok?'ok':'ng'); f.style.display='block';
  $('verdict').textContent=ok?'◯　正解！':'×　まちがい';
  $('ansline').textContent='答え：'+it.a+(ok?'':'（あなたの答え：'+given+'）');
  $('detail').innerHTML='<b>分野：</b>'+esc(it.s)+(it.n?'<br><b>ポイント：</b>'+esc(it.n):'');
  var nb=document.createElement('button'); nb.className='primary';
  nb.textContent=(idx===queue.length-1)?'結果を見る':'次の問題へ';
  nb.onclick=function(){ idx++; render(); };
  $('nav').appendChild(nb); setTimeout(function(){nb.focus();},40);
}
function finish(){
  tshow('result');
  var tot=queue.length,pct=tot?Math.round(correct/tot*100):0;
  $('scoreNum').textContent=correct+' / '+tot;
  $('scoreSub').textContent='正答率 '+pct+'％　'+(pct>=90?'よく覚えられています。':pct>=70?'あと一歩。まちがえた分野をもう一周。':'カードモードと一覧で入れ直してから再挑戦しよう。');
  $('rbar').style.width=pct+'%';
  var mb=$('missBody'); mb.innerHTML='';
  if(!misses.length){ $('missPanel').className='panel hide'; return; }
  $('missPanel').className='panel';
  misses.forEach(function(m){
    var d=document.createElement('div'); d.className='missrow';
    d.innerHTML='<b>['+esc(m.q.s)+']</b> '+esc(m.q.q)+'<span>答え：'+esc(m.q.a)+(m.q.n?'　※'+esc(m.q.n):'')+'</span>';
    mb.appendChild(d);
  });
}

/* ================= 仕分けモード ================= */
var SORTS = DB.groups;
var sIdx=0, sQueue=[], sSet=null, sOk=0, sNg=0;
(function(){
  var host=$('sortList');
  SORTS.forEach(function(g,i){
    var b=document.createElement('button'); b.className='chip';
    b.textContent=g.t+'（'+g.g.length+'group / '+g.g.reduce(function(a,x){return a+x.items.length;},0)+'個）';
    b.onclick=function(){ startSort(i); };
    host.appendChild(b);
  });
})();
function startSort(i){
  sSet=SORTS[i]; sOk=0; sNg=0;
  sQueue=shuffle(sSet.g.reduce(function(a,g){ return a.concat(g.items.map(function(it){return {i:it,g:g.n};})); },[]));
  sIdx=0;
  $('s-setup').className='hide'; $('s-play').className='';
  $('stag').textContent=sSet.t;
  var bh=$('sbuckets'); bh.innerHTML='';
  sSet.g.forEach(function(g){
    var d=document.createElement('div'); d.className='bucket';
    d.innerHTML='<div class="bn">'+esc(g.n)+'</div><div class="bi" data-b="'+esc(g.n)+'"></div>';
    bh.appendChild(d);
  });
  var btn=$('sbtns'); btn.innerHTML='';
  sSet.g.forEach(function(g){
    var b=document.createElement('button'); b.textContent=g.n;
    b.onclick=function(){ sortPick(g.n,b); };
    btn.appendChild(b);
  });
  sRender(); window.scrollTo(0,0);
}
$('sQuit').onclick=function(){ $('s-play').className='hide'; $('s-setup').className=''; };
function sRender(){
  $('sfeed').style.display='none';
  var bs=$('sbtns').querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].disabled=false;
  if(sIdx>=sQueue.length){
    $('sitem').textContent='仕上がり！';
    $('sprog').textContent='全'+sQueue.length+'個';
    $('sbtns').innerHTML='';
    var f=$('sfeed'); f.className='feed '+(sNg===0?'ok':'ng'); f.style.display='block';
    $('sverdict').textContent=(sNg===0?'◯ 全問正解！':'正解 '+sOk+'／誤答 '+sNg);
    $('sdetail').innerHTML=(sSet.n?'<b>ポイント：</b>'+esc(sSet.n)+'<br>':'')+'下の表で、どこに入るのが正しかったか確認しよう。';
    $('sbar').style.width='100%';
    return;
  }
  $('sprog').textContent=(sIdx+1)+' / '+sQueue.length;
  $('slive').textContent='正解 '+sOk+'　誤答 '+sNg;
  $('sbar').style.width=(sIdx/sQueue.length*100)+'%';
  $('sitem').textContent=sQueue[sIdx].i;
}
function sortPick(name,btn){
  var cur=sQueue[sIdx], ok=(name===cur.g);
  if(ok) sOk++; else sNg++;
  var bin=$('sbuckets').querySelector('[data-b="'+cur.g.replace(/"/g,'')+'"]');
  if(!bin){ var all=$('sbuckets').querySelectorAll('.bi'); for(var i=0;i<all.length;i++){ if(all[i].getAttribute('data-b')===cur.g) bin=all[i]; } }
  if(bin){ var sp=document.createElement('span'); sp.className=ok?'good':'bad'; sp.textContent=cur.i; bin.appendChild(sp); }
  var f=$('sfeed'); f.className='feed '+(ok?'ok':'ng'); f.style.display='block';
  $('sverdict').textContent=ok?('◯ 正解！　'+cur.i+' は '+cur.g):('× ちがいます。'+cur.i+' は '+cur.g);
  $('sdetail').innerHTML=sSet.n?('<b>ポイント：</b>'+esc(sSet.n)):'';
  var bs=$('sbtns').querySelectorAll('button'); for(var j=0;j<bs.length;j++) bs[j].disabled=true;
  setTimeout(function(){ sIdx++; sRender(); }, ok?550:1500);
}

/* ================= カードモード ================= */
var cSel={}, cQueue=[], cIdx=0, cDone=0, cFlip=false;
SECS.forEach(function(s){cSel[s]=true;});
mkChips($('cSecRow'),SECS,cSel,cInfo);
$('cAll').onclick=function(){SECS.forEach(function(s){cSel[s]=true;});mkChips($('cSecRow'),SECS,cSel,cInfo);cInfo();};
$('cNone').onclick=function(){SECS.forEach(function(s){cSel[s]=false;});mkChips($('cSecRow'),SECS,cSel,cInfo);cInfo();};
function cPool(){ return DB.cards.filter(function(c){return cSel[c.s];}); }
function cInfo(){ var n=cPool().length; $('cInfo').textContent='選択中：'+n+'枚'; $('cStart').disabled=(n===0); }
cInfo();
$('cStart').onclick=function(){ cQueue=shuffle(cPool().slice()); cIdx=0; cDone=0; $('c-play').className=''; cRender(); window.scrollTo(0,0); };
$('cQuit').onclick=function(){ $('c-play').className='hide'; };
$('flash').onclick=function(){ if(!cFlip){ cFlip=true; $('cback').className='b'; $('chint').textContent='覚えていたら「覚えた」、あやしければ「まだ」'; } };
$('cOkBtn').onclick=function(){ cDone++; cIdx++; cRender(); };
$('cAgainBtn').onclick=function(){ var c=cQueue[cIdx]; cQueue.splice(cIdx,1); cQueue.push(c); cRender(); };
function cRender(){
  cFlip=false; $('cback').className='b hide'; $('chint').textContent='タップすると答えが出ます';
  if(cIdx>=cQueue.length){
    $('cfront').textContent='全部覚えました！';
    $('cback').className='b'; $('cback').textContent=cDone+'枚を「覚えた」に仕分けしました。';
    $('cprog').textContent=''; $('cbar').style.width='100%';
    $('cOkBtn').disabled=true; $('cAgainBtn').disabled=true; return;
  }
  $('cOkBtn').disabled=false; $('cAgainBtn').disabled=false;
  var c=cQueue[cIdx];
  $('cfront').textContent=c.f; $('cback').textContent=c.b;
  $('cprog').textContent='残り '+(cQueue.length-cIdx)+'枚';
  $('cdone').textContent='覚えた '+cDone+'枚';
  $('cbar').style.width=(cDone/(cDone+cQueue.length-cIdx)*100)+'%';
}

/* ================= 一覧モード ================= */
var lSec=SECS[0], lHide=false;
function buildLSec(){
  var h=$('lSecRow'); h.innerHTML='';
  SECS.forEach(function(s){
    var b=document.createElement('button'); b.className='chip'+(s===lSec?' on':''); b.textContent=s;
    b.onclick=function(){ lSec=s; buildLSec(); buildList(); window.scrollTo(0,0); };
    h.appendChild(b);
  });
}
buildLSec();
$('lShow').onclick=function(){ lHide=false; this.className='chip on'; $('lHide').className='chip'; buildList(); };
$('lHide').onclick=function(){ lHide=true; this.className='chip on'; $('lShow').className='chip'; buildList(); };
function buildList(){
  var body=$('lBody'); body.innerHTML='';
  DB.groups.forEach(function(g){
    if(g.s!==lSec)return;
    var t=document.createElement('div'); t.className='listtitle'; t.textContent=g.t; body.appendChild(t);
    if(g.n){ var p=document.createElement('p'); p.className='listnote'; p.textContent='※'+g.n; body.appendChild(p); }
    var tb=document.createElement('table');
    tb.innerHTML='<tr><th style="width:34%">グループ</th><th>なかま</th></tr>';
    g.g.forEach(function(x){
      var tr=document.createElement('tr');
      tr.innerHTML='<td class="g">'+esc(x.n)+'</td><td class="'+(lHide?'hidden-cell':'')+'">'+esc(x.items.join('、'))+'</td>';
      if(lHide){ var c=tr.querySelector('.hidden-cell'); c.onclick=function(){ c.className=''; }; }
      tb.appendChild(tr);
    });
    body.appendChild(tb);
  });
  var cards=DB.cards.filter(function(c){return c.s===lSec;});
  if(cards.length){
    var t2=document.createElement('div'); t2.className='listtitle'; t2.textContent='用語のまとめ'; body.appendChild(t2);
    var tb2=document.createElement('table');
    tb2.innerHTML='<tr><th style="width:30%">用語</th><th>意味・ポイント</th></tr>';
    cards.forEach(function(c){
      var tr=document.createElement('tr');
      tr.innerHTML='<td class="g">'+esc(c.f)+'</td><td class="'+(lHide?'hidden-cell':'')+'">'+esc(c.b)+'</td>';
      if(lHide){ var cc=tr.querySelector('.hidden-cell'); cc.onclick=function(){ cc.className=''; }; }
      tb2.appendChild(tr);
    });
    body.appendChild(tb2);
  }
  var figs=DIAGS.filter(function(d){return d.s===lSec;});
  if(figs.length){
    var t3=document.createElement('div'); t3.className='listtitle'; t3.textContent='図で確認'; body.appendChild(t3);
    figs.forEach(function(d){
      var di=DIAGS.indexOf(d);
      var w=document.createElement('div');
      w.innerHTML='<p class="listnote"><b>'+esc(d.t)+'</b>　'+esc(d.pins.map(function(p){return circled(p.n)+p.a;}).join('　'))+'</p>'+renderDiag(di,0);
      body.appendChild(w);
    });
  }
}
setMode('test');
</script>
</body>
